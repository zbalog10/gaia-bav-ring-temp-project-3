[experiment]
name = "fov1_full"
ring_temp_csv = "data/raw/ring_temp.csv"
los_csv = "data/raw/sfunc7000_fov1_detrended_newtime.csv"
output_dir = "outputs/fov1_full_detrended"
ring_obmt_col = "OBMT_rev"
los_obmt_col = "obmtRev"
target_col = "DN_LINE_OF_SIGHT_VARIATIONS"
trend_col = "trend"
target_scale = 2.0626480624709636e8
save_enriched_dataset = true
save_model = true
make_plots = true
compute_shap = true

[sensors]
columns = ["NEI00054", "NEI00230", "NEI00321"]

[random_forest]
n_estimators = 100
random_state = 101
test_size = 0.3
n_jobs = -1

[temperature_detrend]
enabled = true
method = "linear"
keep_raw_columns = true
preserve_mean = true

[correlation_analysis]
enabled = true
top_n_pairs = 15
