[experiment]
name = "fov1_saa28_detrended"
ring_temp_csv = "data/raw/ring_temp.csv"
los_csv = "data/raw/sfunc7000_fov1_detrended_newtime.csv"
output_dir = "outputs/fov1_zoom_detrended_by_saa/SAA_28"
ring_obmt_col = "OBMT_rev"
los_obmt_col = "obmtRev"
target_col = "DN_LINE_OF_SIGHT_VARIATIONS_detrended"
trend_col = "trend"
target_scale = 2.0626480624709636e8
obmt_min = 16541.17
obmt_max = 16553.16
save_enriched_dataset = true
save_model = true
make_plots = true
compute_shap = true

[sensors]
columns = ["NEI00054", "NEI00230", "NEI00321"]

[random_forest]
n_estimators = 100
random_state = 101
test_size = 0.3
n_jobs = -1

[temperature_detrend]
enabled = true
method = "hybrid_rolling"
switch_obmt = 16515.5
anchor_obmt = 16545.0
fft_initial_window = 50
forced_window_size = 73
keep_raw_columns = true
preserve_mean = false

[correlation_analysis]
enabled = true
top_n_pairs = 15